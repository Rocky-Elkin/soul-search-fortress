<script>
    const input = document.getElementById('user-input');
    const output = document.getElementById('output');
    const sendBtn = document.getElementById('send-btn');
    let isLoading = false;
    let conversationHistory = []; // Stores full chat history

    async function sendMessage() {
        if (isLoading || !input.value.trim()) return;
        isLoading = true;
        sendBtn.disabled = true;
        input.disabled = true;

        const text = input.value.trim();
        input.value = '';

        // Show user message
        const userDiv = document.createElement('div');
        userDiv.className = 'user-msg';
        userDiv.textContent = '> ' + text;
        output.appendChild(userDiv);

        // Show loading
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.textContent = 'The silence stretches... waiting...';
        output.appendChild(loadingDiv);
        output.scrollTop = output.scrollHeight;

        try {
            // Send current prompt + full history
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    prompt: text,
                    history: conversationHistory  // Send history
                })
            });

            if (!response.ok) {
                throw new Error('Server responded with status ' + response.status);
            }

            const data = await response.json();

            // Save to history
            conversationHistory.push({ role: 'user', parts: [text] });
            conversationHistory.push({ role: 'model', parts: [data.text] });

            // Replace loading with AI response
            loadingDiv.remove();
            const aiDiv = document.createElement('div');
            aiDiv.className = 'ai-msg';
            aiDiv.textContent = data.text;
            output.appendChild(aiDiv);

        } catch (err) {
            loadingDiv.remove();
            const errDiv = document.createElement('div');
            errDiv.className = 'error';
            errDiv.textContent = 'Something went wrong: ' + err.message;
            output.appendChild(errDiv);
        }

        output.scrollTop = output.scrollHeight;
        isLoading = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
    }

    input.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    sendBtn.addEventListener('click', sendMessage);
</script>
</html>
