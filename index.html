<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Search: The Fortress</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #1a1a1a;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #game-container {
            width: 90%;
            max-width: 600px;
            border: 1px solid #444;
            padding: 20px;
            background: #252525;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 80vh;
        }
        #output {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            border-bottom: 1px solid #444;
            white-space: pre-wrap;
            line-height: 1.6;
        }
        #output .user-msg { color: #aaa; margin-top: 16px; }
        #output .ai-msg { color: #d4d4d4; margin-top: 8px; }
        #output .loading { color: #666; font-style: italic; margin-top: 8px; }
        #output .error { color: #e88; margin-top: 8px; }
        #input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        input {
            flex: 1;
            padding: 10px;
            background: #333;
            border: 1px solid #555;
            color: white;
            outline: none;
            font-family: inherit;
        }
        input:focus { border-color: #888; }
        button {
            padding: 10px 16px;
            background: #444;
            border: 1px solid #555;
            color: #d4d4d4;
            cursor: pointer;
            font-family: inherit;
        }
        button:hover { background: #555; }
        button:disabled { opacity: 0.4; cursor: default; }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="output">
            <div class="ai-msg">The fortress gates are heavy. A faint light glows from within.\n\nType something below to begin your journey...</div>
        </div>
        <div id="input-row">
            <input type="text" id="user-input" placeholder="Enter your response..." autofocus>
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const input = document.getElementById('user-input');
        const output = document.getElementById('output');
        const sendBtn = document.getElementById('send-btn');
        let isLoading = false;

        async function sendMessage() {
            if (isLoading || !input.value.trim()) return;
            isLoading = true;
            sendBtn.disabled = true;
            input.disabled = true;

            const text = input.value.trim();
            input.value = '';

            // Show user message
            const userDiv = document.createElement('div');
            userDiv.className = 'user-msg';
            userDiv.textContent = '> ' + text;
            output.appendChild(userDiv);

            // Show loading
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = 'The silence stretches... waiting...';
            output.appendChild(loadingDiv);
            output.scrollTop = output.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });

                if (!response.ok) {
                    throw new Error('Server responded with status ' + response.status);
                }

                const data = await response.json();

                // Replace loading with AI response
                loadingDiv.remove();
                const aiDiv = document.createElement('div');
                aiDiv.className = 'ai-msg';
                aiDiv.textContent = data.text;
                output.appendChild(aiDiv);

            } catch (err) {
                // Replace loading with error
                loadingDiv.remove();
                const errDiv = document.createElement('div');
                errDiv.className = 'error';
                errDiv.textContent = 'Something went wrong: ' + err.message;
                output.appendChild(errDiv);
            }

            output.scrollTop = output.scrollHeight;
            isLoading = false;
            sendBtn.disabled = false;
            input.disabled = false;
            input.focus();
        }

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        sendBtn.addEventListener('click', sendMessage);
    </script>
</body>
</html>
